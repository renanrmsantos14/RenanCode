# Fork-only: every push to main builds the unsigned Windows NSIS installer and
# the Linux x64 AppImage in parallel and publishes both as one GitHub Release.
# The build points electron-updater at this repository (GITHUB_REPOSITORY), so
# installed apps pick up each new release.
# The version is <major>.<minor>.<run_number> of apps/desktop, so nothing is
# committed back and upstream syncs never conflict on version bumps.
name: Fork release (Windows)

on:
  push:
    branches: [main]
    # Changes that never reach the desktop app do not cut a release.
    # Later patterns win, so this workflow itself still triggers one.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!apps/mobile/**"
      - "!apps/marketing/**"
      - "!evals/**"
      - "!.github/**"
      - ".github/workflows/fork-release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release-windows
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'renanrmsantos14/RenanCode'
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            script: dist:desktop:win:x64
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            files: "*.exe *.exe.blockmap latest.yml"
          - label: Linux x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            script: dist:desktop:linux
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            files: "*.AppImage latest-linux.yml"
    steps:
      # Real-time scanning inspects every file the install and packaging write.
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Caches Vite+ and Node.js only. No package cache: restoring the ~1 GB
      # store took longer than a cold install.
      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_paths }}
          key: fork-release-${{ runner.os }}-electron-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: fork-release-${{ runner.os }}-electron-v1-

      # The finished binaries are cached, so Rust only compiles when its sources change.
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ runner.os == 'Windows' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: runner.os == 'Linux'
        id: capture_helper_cache
        uses: actions/cache@v6
        with:
          path: |
            native/kde-snap-shot/target/${{ matrix.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ matrix.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ matrix.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Install
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $parts = (node -p "require('./apps/desktop/package.json').version").Split('-')[0].Split('.')
          "version=$($parts[0]).$($parts[1]).${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Build installer
        env:
          T3CODE_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          # Only the AppImage is published.
          T3CODE_DESKTOP_SKIP_DEB: true
        run: vp run ${{ matrix.script }}

      - name: Collect release files
        shell: pwsh
        env:
          PATTERNS: ${{ matrix.files }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($pattern in $env:PATTERNS.Split(' ')) {
            $found = @(Get-ChildItem release -File -Filter $pattern)
            if ($found.Count -eq 0) { throw "No $pattern in release/" }
            $found | Copy-Item -Destination out
          }

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "## O que há de novo"
            echo
            if [ -n "$prev" ]; then
              changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" \
                -q '.commits[] | select(.parents | length == 1) | .commit.message | split("\n")[0]' |
                grep -v '^chore(release)' | sed 's/^/- /' || true)
              echo "${changes:-- Sem mudanças de código desde $prev.}"
              echo
              echo "Comparação completa: https://github.com/$GITHUB_REPOSITORY/compare/$prev...v$VERSION"
            else
              echo "- Primeira versão publicada."
            fi
            echo
            echo "Instaladores Windows x64 (não assinado) e Linux x64 (AppImage), gerados de $GITHUB_SHA."
          } > notes.md
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RenanCode $VERSION" --notes-file notes.md
