# Fork-only: pushes to main that touch the mobile app build an Android APK and
# publish it as its own GitHub Release (tag android-v<version>), in parallel with
# and independent of the desktop release. Desktop-only changes never rebuild it.
# The release is never marked latest, so electron-updater keeps resolving the
# desktop release. OTA updates are off: upstream's Expo channel must not replace
# the fork's JavaScript.
# Installed APKs update themselves from these releases (apps/mobile/src/features/updates/apk-updates.ts).
# ANDROID_KEYSTORE_BASE64 keeps every APK on one signing key, so a new APK
# installs over the previous one. Without it each build gets a throwaway key.
name: Fork release (Android)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "!**/*.md"
      - ".github/workflows/fork-release-android.yml"
  workflow_dispatch:

permissions:
  contents: write

# A running build finishes and publishes; pushes meanwhile collapse into one queued run.
concurrency:
  group: fork-release-android
  cancel-in-progress: false

jobs:
  apk:
    if: github.repository == 'renanrmsantos14/RenanCode'
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      MOBILE_VERSION_POLICY: appVersion
      EXPO_NO_GIT_STATUS: "1"
      # The app checks this repo's android-v* releases and offers to install newer APKs.
      T3CODE_ANDROID_APK_UPDATE_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # prebuild --clean discards android/.cxx, so native libraries recompile every run without ccache.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: fork-release-android
          max-size: 2G

      - name: Resolve version
        id: version
        run: |
          base=$(grep -oP 'T3CODE_MOBILE_VERSION \?\? "\K[0-9]+\.[0-9]+' apps/mobile/app.config.ts)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          T3CODE_MOBILE_VERSION: ${{ steps.version.outputs.version }}
        run: vp exec expo prebuild --clean --platform android --no-install

      - name: Set version code and signing key
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; this APK will not install over the previous one."
          fi

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="RenanCode-Android-$VERSION.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '[.[] | select(.tagName | startswith("android-v"))][0].tagName')
          {
            echo "## O que há de novo"
            echo
            if [ -n "$prev" ]; then
              changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" \
                -q '.commits[] | select(.parents | length == 1) | .commit.message | split("\n")[0]' |
                grep -v '^chore(release)' | sed 's/^/- /' || true)
              echo "${changes:-- Sem mudanças de código desde $prev.}"
              echo
              echo "Comparação completa: https://github.com/$GITHUB_REPOSITORY/compare/$prev...android-v$VERSION"
            else
              echo "- Primeira versão Android publicada."
            fi
            echo
            echo "APK Android (arm64), gerado de $GITHUB_SHA."
          } > notes.md
          gh release create "android-v$VERSION" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RenanCode Android $VERSION" --notes-file notes.md --latest=false
